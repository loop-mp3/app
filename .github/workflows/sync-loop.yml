name: Sync Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Remove the existing extension submodule entry
        run: |
          git rm --cached --ignore-unmatch extention/loop
          rm -rf extention/loop

      - name: Checkout loop extension
        uses: actions/checkout@v4
        with:
          repository: loop-mp3/loop
          path: extention/loop
          persist-credentials: false

      - name: Remove nested git metadata
        run: rm -rf extention/loop/.git

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A extention/loop

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync Loop extension"
            git push origin HEAD:main
          fi
